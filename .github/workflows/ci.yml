name: PowerShell CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax compatibility
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse using Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('ThreatJET.ps1', 'Build-TJETCveDatabase.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if (@($errors).Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message }
              throw "PowerShell 5.1 syntax check failed for $file"
            }
            Write-Host "Windows PowerShell 5.1 syntax OK: $file"
          }
      - name: Parse using PowerShell 7 on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('ThreatJET.ps1', 'Build-TJETCveDatabase.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if (@($errors).Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message }
              throw "PowerShell 7 syntax check failed for $file"
            }
            Write-Host "PowerShell 7 syntax OK: $file"
          }

  pester:
    name: Pester smoke tests
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
          Import-Module Pester -MinimumVersion 5.5.0 -ErrorAction Stop
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config
      - name: Test in PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
          Import-Module Pester -MinimumVersion 5.5.0 -ErrorAction Stop
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

  lint:
    name: PSScriptAnalyzer (advisory)
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report lint diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          Import-Module PSScriptAnalyzer -ErrorAction Stop
          foreach ($file in @('ThreatJET.ps1', 'Build-TJETCveDatabase.ps1')) {
            $findings = @(Invoke-ScriptAnalyzer -Path $file -Severity Error,Warning)
            Write-Host ("{0}: {1} diagnostic(s)" -f $file, $findings.Count)
            $findings | Select-Object -First 30 RuleName, Severity, Line, Message | Format-Table -Wrap
          }
          Write-Host 'Lint findings are advisory until the baseline is reviewed.'
